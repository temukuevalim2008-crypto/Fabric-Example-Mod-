name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Check project structure
        run: |
          echo "=== PROJECT STRUCTURE ==="
          find . -maxdepth 3 -type f | sort
          echo "========================="

      - name: Find Gradle wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "ОШИБКА: ./gradlew не найден в корне проекта!"
            echo
            echo "gradlew найден в следующих местах:"
            find . -name "gradlew" -type f -print
            exit 1
          fi

          chmod +x ./gradlew

          echo "Gradle wrapper найден:"
          ls -lah ./gradlew

      - name: Build mod
        run: |
          ./gradlew build --no-daemon --stacktrace

      - name: Show build files
        if: always()
        run: |
          echo "=== build/libs ==="

          if [ -d "./build/libs" ]; then
            ls -lah ./build/libs/
          else
            echo "Папка build/libs не существует!"
          fi

          echo
          echo "=== ALL JAR FILES ==="
          find . -type f -name "*.jar" -print

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Mod
          path: build/libs/*.jar
          if-no-files-found: error
