name: build

on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Find and build mod
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f -print -quit)

          if [ -z "$GRADLEW_PATH" ]; then
            echo "ОШИБКА: gradlew не найден!"
            echo "Содержимое репозитория:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Найден Gradle wrapper: $GRADLEW_PATH"

          MOD_DIR=$(dirname "$GRADLEW_PATH")
          cd "$MOD_DIR"

          chmod +x ./gradlew
          ./gradlew build --no-daemon

          echo "=== BUILD/LIBS ==="
          ls -lah build/libs/ || true

          echo "=== ВСЕ JAR ФАЙЛЫ ==="
          find . -type f -name "*.jar" -print

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: "**/build/libs/*.jar"
          if-no-files-found: error
          
